name: PizzaOps CI

on:
  push:
    paths:
      - "src/MCP-Demos03-PizzaOps/**"
      - ".github/workflows/pizzaops-ci.yml"
  pull_request:
    paths:
      - "src/MCP-Demos03-PizzaOps/**"
      - ".github/workflows/pizzaops-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet restore PizzaOps.sln
      - name: Check vulnerable dependencies
        working-directory: src/MCP-Demos03-PizzaOps
        shell: pwsh
        run: |
          $report = dotnet list PizzaOps.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
          $audit = $report | ConvertFrom-Json
          if ($audit.problems) { throw 'Dependency audit reported feed problems.' }
          $affected = @($audit.projects | Where-Object {
            $_.frameworks | Where-Object { $_.topLevelPackages -or $_.transitivePackages }
          })
          if ($affected.Count -gt 0) { throw 'Vulnerable dependencies were found.' }
      - name: Build
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet build PizzaOps.sln --no-restore
      - name: Test
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet test PizzaOps.sln --no-build --no-restore
      - name: Verify formatting
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet format PizzaOps.sln --verify-no-changes --no-restore
      - name: Install local E2E prerequisites
        run: npm install --global azurite@3.35.0 azure-functions-core-tools@4.16.0 --unsafe-perm
      - name: Run real local E2E
        working-directory: src/MCP-Demos03-PizzaOps
        shell: pwsh
        run: .\scripts\Test-Local.ps1
