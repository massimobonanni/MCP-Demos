name: PizzaOps CI

on:
  push:
    paths:
      - "src/MCP-Demos03-PizzaOps/**"
      - ".github/workflows/pizzaops-ci.yml"
  pull_request:
    paths:
      - "src/MCP-Demos03-PizzaOps/**"
      - ".github/workflows/pizzaops-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet restore PizzaOps.sln
      - name: Build
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet build PizzaOps.sln --no-restore
      - name: Verify formatting
        working-directory: src/MCP-Demos03-PizzaOps
        run: dotnet format PizzaOps.sln --verify-no-changes --no-restore
